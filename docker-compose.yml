services:
  # Serviço para o aplicativo web Django
  web:
    build: .
    container_name: heparin_web
    command: gunicorn --bind 0.0.0.0:8000 heparin_converter.wsgi
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=heparin_converter.settings
      # DEBUG=True garante SQLite/console no ambiente local do compose.
      # Para rodar contra o Postgres do compose, use DEBUG=False e as credenciais abaixo.
      - DEBUG=True
      - SECRET_KEY=django-insecure-compose-local-key
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=heparin_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False

  # Worker do Celery
  worker:
    build: .
    container_name: heparin_worker
    entrypoint: celery
    command: -A heparin_converter worker -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=heparin_converter.settings
      - DEBUG=True
      - SECRET_KEY=django-insecure-compose-local-key
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=heparin_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False

  # Agendador do Celery (tarefas periódicas)
  beat:
    build: .
    container_name: heparin_beat
    entrypoint: celery
    command: -A heparin_converter beat -l info
    volumes:
      - .:/app
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=heparin_converter.settings
      - DEBUG=True
      - SECRET_KEY=django-insecure-compose-local-key
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=heparin_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False

  # Broker/result backend
  redis:
    image: redis:7-alpine
    container_name: heparin_redis
    ports:
      - "6379:6379"

  # Serviço para o banco de dados PostgreSQL
  db:
    image: postgres:13
    container_name: heparin_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=heparin_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


# Volume para persistência dos dados do PostgreSQL
volumes:
  postgres_data:
